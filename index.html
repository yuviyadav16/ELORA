<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DragoEagle AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. AUTHENTICATION SCREEN -->
  <div id="authScreen" class="screen active">
    <div class="auth-box">
      <h1 class="brand-title">DragoEagle</h1>
      <h2>Welcome to DragoEagle</h2>
      
      <div id="loginForm">
        <input type="email" id="email" placeholder="Email Address" required>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Password" required>
        </div>
        <button class="primary-btn" onclick="loginDummy()">Sign In / Sign Up</button>
      </div>
      
      <p class="links">
        <a href="#">Verify Email</a> | 
        <a href="#">Forgot Password?</a>
      </p>
    </div>
  </div>

  <!-- 2. MAIN DASHBOARD (Hidden by default) -->
  <div id="dashboardScreen" class="screen hidden">
    <header class="dash-header">
      <div class="menu-icon">☰ Menu</div>
      <div class="brand">DragoEagle</div>
    </header>

    <div class="posters-container">
      <!-- Aditi -->
      <div class="poster-card" onclick="openChatRoom('Aditi')">
        <div class="offer-tag">🔥 70% OFF</div>
        <img src="11995.png" alt="Aditi">
        <div class="poster-details">
          <h3>Aditi</h3>
          <p class="plan-price"><strike>₹165</strike> <strong>₹49/mo</strong></p>
        </div>
      </div>

      <!-- Suhani -->
      <div class="poster-card" onclick="openChatRoom('Suhani')">
        <div class="offer-tag">🔥 70% OFF</div>
        <img src="11996.png" alt="Suhani">
        <div class="poster-details">
          <h3>Suhani</h3>
          <p class="plan-price"><strike>₹330</strike> <strong>₹99/mo</strong></p>
        </div>
      </div>

      <!-- Aarohi -->
      <div class="poster-card" onclick="openChatRoom('Aarohi')">
        <div class="offer-tag">🔥 70% OFF</div>
        <img src="11997.png" alt="Aarohi">
        <div class="poster-details">
          <h3>Aarohi</h3>
          <p class="plan-price"><strike>₹660</strike> <strong>₹199/mo</strong></p>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. CHAT INTERFACE (Hidden by default) -->
  <div id="chatScreen" class="screen hidden">
    <header class="chat-header">
      <button class="back-btn" onclick="goBackToDashboard()">🔙</button>
      <div id="chatCharacterName" class="chat-title">
        <!-- Logo and Name will load here -->
      </div>
      <div class="chat-actions">
        <button class="action-btn">🗑️</button>
      </div>
    </header>
    
    <div class="chat-history" id="chatHistory">
      <!-- Chat loads here -->
    </div>

    <div class="message-input">
      <input type="text" id="msgText" placeholder="Type a message...">
      <button class="send-btn" onclick="sendMsg()">Send</button>
    </div>
  </div>

  <script src="app-logic.js"></script>
</body>
</html>
